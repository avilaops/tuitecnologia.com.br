name: Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # O site no ar é o HTML estático da raiz; src/ (Next.js) ainda não é publicado.
      - name: Separa os arquivos publicados
        run: |
          mkdir _site
          cp *.html *.xml *.txt *.png favicon.svg manifest.json _site/
          cp -r css js _site/
          rm _site/INTEGRACOES.html
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Obter publicador de texto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: avilaops/motor-web
          ref: a1bba366c848bf2df3634cba6de2649a8626435c
          path: .publicacao-texto
          persist-credentials: false
      - name: Instalar publicador de texto
        working-directory: .publicacao-texto
        run: npm ci --ignore-scripts --omit=dev
      - name: Gerar Markdown e MDX do HTML publicado
        run: |
          cat > _site/_headers <<'HEADERS'
          /carrinho
            X-Robots-Tag: noindex,nofollow
          /obrigado
            X-Robots-Tag: noindex,nofollow
          HEADERS
          node .publicacao-texto/bin/publicar-seo.mjs --diretorio _site --configuracao seo.config.json --repositorio .
          node .publicacao-texto/bin/publicar-texto.mjs --diretorio _site --origem https://tuitecnologia.com.br --indexar-texto
      - name: Generate public discovery and WebMCP
        run: node .publicacao-texto/bin/publicar-descoberta.mjs --diretorio _site --origem https://tuitecnologia.com.br --excluir-prefixo /carrinho.html --excluir-prefixo /obrigado.html --excluir-prefixo /INTEGRACOES.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-pages-site
          path: _site
          include-hidden-files: true
      - name: Publicar no Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: 85b914dcdebf6fa2fce7b819bc542294
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes --package=wrangler@4.161.0 wrangler pages deploy _site --project-name=tui-tecnologia --branch=main --commit-hash=${{ github.sha }}
