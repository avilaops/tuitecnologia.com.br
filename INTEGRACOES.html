     WHATSAPP BUSINESS API (CHAT WIDGET)
     Adicionar antes do </body>
     ============================================ -->

<!-- WhatsApp Chat Widget -->
<script>
    (function() {
        var whatsappNumber = '5517988151758'; // Seu número com DDI e DDD
        var whatsappMessage = 'Olá! Vim do site e gostaria de mais informações.';
        
        var btn = document.createElement('a');
        btn.href = 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(whatsappMessage);
        btn.target = '_blank';
        btn.rel = 'noopener noreferrer';
        btn.className = 'whatsapp-float';
        btn.innerHTML = '<i class="fab fa-whatsapp"></i>';
        
        document.body.appendChild(btn);
    })();
</script>

<!-- CSS para o botão flutuante do WhatsApp -->
<style>
    .whatsapp-float {
        position: fixed;
        width: 60px;
        height: 60px;
        bottom: 40px;
        right: 40px;
        background-color: #25d366;
        color: #FFF;
        border-radius: 50px;
        text-align: center;
        font-size: 30px;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }
    
    .whatsapp-float:hover {
        background-color: #1eaa52;
        transform: scale(1.1);
    }
    
    @media (max-width: 768px) {
        .whatsapp-float {
            width: 50px;
            height: 50px;
            bottom: 20px;
            right: 20px;
            font-size: 25px;
        }
    }
</style>

<!-- ============================================
     GOOGLE RECAPTCHA V3
     Adicionar no <head> e modificar formulário
     ============================================ -->

<!-- Script do reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js?render=SUA_CHAVE_DO_SITE"></script>

<!-- No formulário: -->
<script>
function onSubmit(token) {
    document.getElementById("contactForm").submit();
}

function validateForm() {
    grecaptcha.ready(function() {
        grecaptcha.execute('SUA_CHAVE_DO_SITE', {action: 'submit'}).then(function(token) {
            // Adiciona o token ao formulário
            var recaptchaResponse = document.getElementById('recaptchaResponse');
            recaptchaResponse.value = token;
            document.getElementById('contactForm').submit();
        });
    });
}
</script>

<!-- Campo hidden no formulário -->
<input type="hidden" name="recaptcha_response" id="recaptchaResponse">
